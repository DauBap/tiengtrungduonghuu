name: Server uptime monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous server status
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/server-uptime-state
          key: server-uptime-state-${{ github.run_id }}
          restore-keys: server-uptime-state-
      - name: Check server and notify on status changes
        run: node .github/scripts/server-uptime.mjs
        id: monitor
        env:
          SERVER_URL: https://tiengtrungduonghuu.edu.vn/
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPTIME_STATE_FILE: ${{ runner.temp }}/server-uptime-state/status
      - name: Save changed server status
        if: steps.monitor.outputs.state-changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/server-uptime-state
          key: server-uptime-state-${{ github.run_id }}
