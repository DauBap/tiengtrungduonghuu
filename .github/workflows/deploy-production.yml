name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: 100.98.11.60

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing PRODUCTION_SSH_KEY secret"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing PRODUCTION_SSH_KNOWN_HOSTS secret"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/production_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/production_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/production_deploy" > /dev/null
          ssh-keygen -F 100.98.11.60 -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Deploy latest main
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/production_deploy" \
            -p 22 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            baotn@100.98.11.60 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/baotn/apps/tiengtrungduonghuu/remix-app
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Production worktree is dirty; refusing to overwrite server-side changes." >&2
            git status --short >&2
            exit 1
          fi
          git fetch origin main
          git switch main
          git merge --ff-only origin/main
          /usr/bin/npm ci --no-audit --no-fund
          /usr/bin/npx prisma generate
          /usr/bin/npm run build
          sudo -n systemctl restart tiengtrungduonghuu.service
          sudo -n systemctl is-active --quiet tiengtrungduonghuu.service
          for attempt in {1..15}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 http://127.0.0.1:3000/teacher/attendance || true)"
            if [[ "$status" =~ ^[23][0-9][0-9]$ ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "Production did not serve /teacher/attendance successfully after restart." >&2
          exit 1
          REMOTE

      - name: Notify Telegram
        if: ${{ always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_OUTCOME: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual deployment' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_OUTCOME" == "success" ]]; then
            status="✅ Deploy production thành công"
          else
            status="❌ Deploy production thất bại"
          fi
          message="$status
          Repository: $GITHUB_REPOSITORY
          Commit: ${COMMIT_SHA:0:7}
          Nội dung: $COMMIT_MESSAGE
          Chi tiết: $RUN_URL"
          curl --fail --silent --show-error --retry 2 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"
