name: Generate scheduled attendance sessions

on:
  schedule:
    - cron: "5 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-scheduled-attendance-sessions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate the next month of class sessions
        env:
          ATTENDANCE_SESSION_CRON_SECRET: ${{ secrets.ATTENDANCE_SESSION_CRON_SECRET }}
        run: |
          if [ -z "$ATTENDANCE_SESSION_CRON_SECRET" ]; then
            echo "ATTENDANCE_SESSION_CRON_SECRET repository secret is required."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 240 \
            --retry 2 --retry-all-errors --retry-delay 10 \
            --request POST \
            --header "Authorization: Bearer $ATTENDANCE_SESSION_CRON_SECRET" \
            "https://tiengtrungduonghuu.edu.vn/api/cron/attendance-sessions"
